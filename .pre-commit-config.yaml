---
# pre-commit (https://pre-commit.com) checks. The repository's own hook,
# .githooks/pre-commit, runs them on the staged files when pre-commit is
# installed, after its own checks. It replaces `pre-commit install`, which
# refuses to install while `git config core.hooksPath .githooks` is set.
#   pre-commit install-hooks     # once per clone: download the hook environments
#   pre-commit run --all-files   # every check on every tracked file
#   pre-commit autoupdate        # refresh the revs below
# The ShellCheck hook runs ShellCheck's official Docker image, so it needs
# Docker; without it, skip that hook with SKIP=shellcheck.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
      # The Oh My Posh themes keep the upstream files' formatting, as in
      # .editorconfig.
      - id: end-of-file-fixer
        exclude: ^home/\.config/oh-my-posh/themes/
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: ^home/\.config/oh-my-posh/themes/
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: detect-private-key
      - id: detect-aws-credentials
        args: [--allow-missing-credentials]

  # Bash files, found by extension, Bash startup file name, or shebang.
  # .githooks/pre-commit skips this hook by its id, shellcheck, because it runs
  # ShellCheck itself.
  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.11.0
    hooks:
      - id: shellcheck
