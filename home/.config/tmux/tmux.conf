# tmux, installed as ~/.config/tmux/tmux.conf. Needs tmux 3.2 or later, for the
# terminal-features option below (3.1 already reads this location).
# https://man.openbsd.org/tmux

# DEFAULTS {{{
# -- prefix: C-a instead of C-b
set-option -g prefix C-a
unbind-key C-b
bind-key C-a send-prefix

# -- reload with C-a r
bind-key r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# -- timing
# Wait 10 ms after Esc for the rest of a key sequence: short enough that vim
# feels instant, long enough that Alt keys and terminal replies arrive whole
# (0 can split them into a stray Esc plus characters).
set-option -sg escape-time 10
set-option -sg repeat-time 600 # window for repeatable keys such as resizing

# -- buffers
set-option -g history-limit 100000 # scrollback lines per pane
set-option -g buffer-limit 200     # named paste buffers kept
# }}}

# COLOR & DISPLAY {{{
# -- color: tmux-256color adds italics, but only where its terminfo entry exists
# (some minimal systems lack it), so screen-256color is the fallback. The RGB
# feature passes true color through.
set-option -g default-terminal "screen-256color"
if-shell 'infocmp tmux-256color >/dev/null 2>&1' 'set-option -g default-terminal "tmux-256color"'
set-option -as terminal-features ",xterm-256color:RGB"

# -- window names: programs cannot rename windows with escape sequences; the
# terminal title is set under STATUS
set-option -g allow-rename off

# -- windows and panes start at 1, and windows renumber when one closes
set-option -g base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on
set-window-option -g automatic-rename on
set-window-option -g aggressive-resize on # size to the smallest client actually viewing a window
set-option -g display-panes-time 800
set-option -g display-time 1000
set-option -g focus-events on
# }}}

# VISUALS & CLOCK {{{
# -- quiet: no activity monitoring, bells, or visual alerts
set-window-option -g monitor-activity off
set-option -g visual-activity off
set-option -g visual-bell off
set-option -g visual-silence off
set-option -g bell-action none

# -- clock (C-a t)
set-window-option -g clock-mode-style 24
set-window-option -g clock-mode-colour blue
# }}}

# NAVIGATION {{{
# -- select panes with h j k l, resize with H J K L (repeatable)
bind-key -r h select-pane -L
bind-key -r j select-pane -D
bind-key -r k select-pane -U
bind-key -r l select-pane -R
bind-key -r H resize-pane -L 2
bind-key -r J resize-pane -D 2
bind-key -r K resize-pane -U 2
bind-key -r L resize-pane -R 2
# Splits keep their defaults: C-a % side by side, C-a " stacked.
# }}}

# MOUSE & COPY {{{
set-option -g mouse on
# C-a [ enters copy mode; C-a ] pastes the latest buffer.
# }}}

# STATUS {{{
set-option -g status on
set-option -g status-interval 1 # the clock shows seconds
set-option -g status-position bottom
set-option -g status-left '☁️  #[fg=green,bold] #{user}#[fg=black]@#[fg=cyan,bold]#H #[fg=black]| '
set-option -g status-left-length 40 # room for the icon, user@host, and the separator
set-option -g status-right '#[bg=colour242,bold] Date: %a, %b %d, %Y #[bg=colour238,bold] Time: %l:%M:%S %p  ⚡'
set-option -g status-right-length 50
set-option -g status-bg colour235
set-option -g status-fg white

# -- terminal title: the terminal's window or tab title starts with "tmux", then
# tmux's default (session:window index:window name - pane title), so it shows that
# tmux is running. tmux leaves the title alone unless set-titles is on.
set-option -g set-titles on
set-option -g set-titles-string 'tmux: #S:#I:#W - #T'

# -- privileged windows: a window's tab turns red while any of its panes runs
# sudo, sudoedit, su, doas, or run0 in the foreground, and every tab is red when
# this tmux server itself runs as root. tmux sees only the foreground program's
# name. sudo keeps the terminal for a whole session when it uses its own pty (the
# default since sudo 1.9.14), so `sudo -i` and `sudo su -` stay red until they
# exit; a plain `su -` hands the terminal to root's shell, which looks like any
# other shell, so use `su --pty -` instead. Tabs follow within a second
# (status-interval). Apart from the color, the tab text is tmux's default.
set-option -g @elevated '#{||:#{==:#{uid},0},#{P:#{?#{m/r:^(sudo|sudoedit|su|doas|run0)$,#{pane_current_command}},1,}}}'
set-option -g window-status-format '#{?#{E:@elevated},#[bg=red#,fg=white#,bold],}#I:#W#{?window_flags,#{window_flags}, }'
set-option -g window-status-current-format '#{?#{E:@elevated},#[bg=red#,fg=white#,bold],}#I:#W#{?window_flags,#{window_flags}, }'
# }}}

# PLUGINS {{{
# No plugin manager is configured. For tpm (https://github.com/tmux-plugins/tpm),
# list plugins with `set -g @plugin '...'` and end the file with:
#   run '~/.tmux/plugins/tpm/tpm'
# }}}
